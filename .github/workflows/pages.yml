# Deploy di GitHub Pages via workflow: la pipeline "legacy" del repo si è
# incagliata il 06/08/2026 (build eternamente "building", servizio
# "errored") e questo percorso la bypassa del tutto. Sito statico puro:
# checkout → artifact → deploy, zero build step.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
